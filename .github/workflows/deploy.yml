name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editable_cv_web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: editable_cv_web

      - name: Build
        run: npm run build
        working-directory: editable_cv_web

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: editable_cv_web/dist
          branch: gh-pages
